name: Workshop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Architecture Plate renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin
      - name: Connect the pinned NEXAH Core
        run: ./scripts/bootstrap-workspace --clone-core
      - name: Verify the development publication baseline
        run: ./scripts/release-check --development
