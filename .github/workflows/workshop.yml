name: Workshop checks

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository workshop
        run: ./scripts/check-workspace
      - name: Check development release state
        run: ./scripts/release-check --development
