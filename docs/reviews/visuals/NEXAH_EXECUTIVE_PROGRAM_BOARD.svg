<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" role="img" aria-labelledby="title desc">
  <title id="title">NEXAH Executive Program Board — From Architecture to Execution</title>
  <desc id="desc">A printable A3 landscape program board distinguishing completed, active, strategic, pending, risks, and opportunities for the next 3 to 12 months.</desc>
  <defs>
    <style>
      text { font-family: Inter, Avenir, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
      .title { font-size: 42px; font-weight: 700; fill: #152238; }
      .subtitle { font-size: 20px; font-weight: 400; fill: #536174; }
      .section { font-size: 22px; font-weight: 700; }
      .item { font-size: 17px; font-weight: 500; fill: #26364d; }
      .small { font-size: 14px; font-weight: 600; fill: #536174; }
      .priority-number { font-size: 28px; font-weight: 700; }
      .priority-title { font-size: 16px; font-weight: 700; fill: #152238; }
      .roadmap-time { font-size: 16px; font-weight: 700; }
      .roadmap-copy { font-size: 14px; font-weight: 500; fill: #536174; }
      .footer { font-size: 14px; font-weight: 700; fill: #536174; }
    </style>
  </defs>

  <rect width="1680" height="1188" fill="#ffffff"/>
  <rect x="18" y="18" width="1644" height="1152" fill="none" stroke="#aab8c8" stroke-width="2"/>

  <!-- Header -->
  <text x="58" y="62" class="eyebrow" fill="#1457a6">NEXAH EXECUTIVE PROGRAM BOARD · 2026-07-25</text>
  <text x="58" y="112" class="title">FROM ARCHITECTURE TO EXECUTION</text>
  <text x="58" y="148" class="subtitle">Maximize impact through navigation, reproducibility, public delivery, scientific credibility, and stewardship.</text>

  <rect x="1250" y="52" width="372" height="96" rx="16" fill="#f2f6fb" stroke="#1457a6" stroke-width="2"/>
  <text x="1276" y="82" class="eyebrow" fill="#1457a6">CURRENT PHASE</text>
  <text x="1276" y="112" font-size="21" fill="#152238" font-weight="700">ORIENTATION INFRASTRUCTURE</text>
  <text x="1276" y="136" font-size="15" fill="#536174">Execution · Publication · Adoption</text>

  <line x1="58" y1="174" x2="1622" y2="174" stroke="#aab8c8" stroke-width="2"/>

  <!-- Top priorities -->
  <text x="58" y="208" class="eyebrow" fill="#092f68">TOP PRIORITIES</text>

  <rect x="58" y="226" width="296" height="105" rx="14" fill="#f7f9fc" stroke="#1457a6" stroke-width="2"/>
  <text x="78" y="270" class="priority-number" fill="#1457a6">01</text>
  <text x="128" y="258" class="priority-title">ADOPT THE DESK</text>
  <text x="128" y="284" class="small">one maintained Orientation Surface</text>
  <text x="128" y="307" class="small">with owners and exact sources</text>

  <rect x="375" y="226" width="296" height="105" rx="14" fill="#f7f9fc" stroke="#3e7c50" stroke-width="2"/>
  <text x="395" y="270" class="priority-number" fill="#3e7c50">02</text>
  <text x="445" y="258" class="priority-title">LOCK BASELINES</text>
  <text x="445" y="284" class="small">revisions · tags · checksums</text>
  <text x="445" y="307" class="small">citation-ready frozen evidence</text>

  <rect x="692" y="226" width="296" height="105" rx="14" fill="#f7f9fc" stroke="#20a6b7" stroke-width="2"/>
  <text x="712" y="270" class="priority-number" fill="#168a99">03</text>
  <text x="762" y="258" class="priority-title">VERIFY PUBLIC DELIVERY</text>
  <text x="762" y="284" class="small">nexah.de · NEXAHEDRON</text>
  <text x="762" y="307" class="small">DNS · TLS · anonymous journeys</text>

  <rect x="1009" y="226" width="296" height="105" rx="14" fill="#f7f9fc" stroke="#6d3d91" stroke-width="2"/>
  <text x="1029" y="270" class="priority-number" fill="#6d3d91">04</text>
  <text x="1079" y="258" class="priority-title">PUBLISH THE EVIDENCE</text>
  <text x="1079" y="284" class="small">papers · reports · public talks</text>
  <text x="1079" y="307" class="small">limits visible beside results</text>

  <rect x="1326" y="226" width="296" height="105" rx="14" fill="#f7f9fc" stroke="#b98320" stroke-width="2"/>
