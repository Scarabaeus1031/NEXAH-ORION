  <text x="84" y="776" class="item">○ Root Desk approval</text>
  <text x="84" y="808" class="item">○ POA freeze identity and citation</text>
  <text x="84" y="840" class="item">○ Connected Core revision decision</text>
  <text x="84" y="872" class="item">○ Public deployment verification</text>
  <text x="84" y="904" class="item">○ NEXAHEDRON public repository</text>
  <text x="84" y="936" class="item">○ Archive and visual status metadata</text>

  <rect x="591" y="690" width="498" height="258" rx="18" fill="#fbf2f2" stroke="#a13d3d" stroke-width="3"/>
  <rect x="591" y="690" width="498" height="54" rx="18" fill="#a13d3d"/>
  <rect x="591" y="726" width="498" height="18" fill="#a13d3d"/>
  <text x="617" y="725" class="section" fill="#ffffff">RISKS</text>
  <text x="617" y="776" class="item">! Knowledge and decision concentration</text>
  <text x="617" y="808" class="item">! Repository revision drift</text>
  <text x="617" y="840" class="item">! Public deployment dependencies</text>
  <text x="617" y="872" class="item">! Scientific claim inflation</text>
  <text x="617" y="904" class="item">! Maintenance capacity</text>
  <text x="617" y="936" class="item">! Weak external replication or review</text>

  <rect x="1124" y="690" width="498" height="258" rx="18" fill="#eef8f8" stroke="#168a99" stroke-width="3"/>
  <rect x="1124" y="690" width="498" height="54" rx="18" fill="#168a99"/>
  <rect x="1124" y="726" width="498" height="18" fill="#168a99"/>
  <text x="1150" y="725" class="section" fill="#ffffff">OPPORTUNITIES</text>
  <text x="1150" y="776" class="item">+ Open science and reproducibility</text>
  <text x="1150" y="808" class="item">+ Power Systems / IEEE collaboration</text>
  <text x="1150" y="840" class="item">+ Human orientation studies</text>
  <text x="1150" y="872" class="item">+ University teaching and workshops</text>
  <text x="1150" y="904" class="item">+ Builder participation</text>
  <text x="1150" y="936" class="item">+ Library and public knowledge pathways</text>

  <!-- Roadmap -->
  <text x="58" y="990" class="eyebrow" fill="#092f68">EXECUTION HORIZON</text>
  <line x1="58" y1="1027" x2="1622" y2="1027" stroke="#aab8c8" stroke-width="3"/>
  <circle cx="120" cy="1027" r="11" fill="#1457a6"/>
  <circle cx="540" cy="1027" r="11" fill="#20a6b7"/>
  <circle cx="990" cy="1027" r="11" fill="#6d3d91"/>
  <circle cx="1500" cy="1027" r="11" fill="#3e7c50"/>

  <text x="120" y="1062" class="roadmap-time" fill="#1457a6" text-anchor="middle">30 DAYS</text>
  <text x="120" y="1085" class="roadmap-copy" text-anchor="middle">operational truth</text>

  <text x="540" y="1062" class="roadmap-time" fill="#168a99" text-anchor="middle">90 DAYS</text>
  <text x="540" y="1085" class="roadmap-copy" text-anchor="middle">enterable and citable</text>

  <text x="990" y="1062" class="roadmap-time" fill="#6d3d91" text-anchor="middle">6 MONTHS</text>
  <text x="990" y="1085" class="roadmap-copy" text-anchor="middle">external use and review</text>

  <text x="1500" y="1062" class="roadmap-time" fill="#3e7c50" text-anchor="middle">12 MONTHS</text>
  <text x="1500" y="1085" class="roadmap-copy" text-anchor="middle">durable stewardship and impact</text>

  <!-- Footer -->
  <line x1="58" y1="1120" x2="1622" y2="1120" stroke="#aab8c8" stroke-width="2"/>
  <text x="58" y="1150" class="footer">EXECUTIVE PROGRAM REVIEW · INFORMATIVE STRATEGIC OVERVIEW</text>
  <text x="1622" y="1150" class="footer" text-anchor="end">EXECUTION, NOT INVENTION · EXISTING ARCHITECTURE REMAINS STABLE</text>
</svg>
