  <text x="84" y="446" class="item">✓ Constitution and responsibility model</text>
  <text x="84" y="478" class="item">✓ Repository Architecture</text>
  <text x="84" y="510" class="item">✓ OLS 1.0 and Kernel baseline</text>
  <text x="84" y="542" class="item">✓ Editorial OS and Library Architecture</text>
  <text x="84" y="574" class="item">✓ ORION V1 · POA-001 · POA-002</text>
  <text x="84" y="606" class="item">✓ Ecosystem Review</text>
  <text x="84" y="638" class="item">✓ Orientation Infrastructure</text>

  <rect x="591" y="360" width="498" height="300" rx="18" fill="#f2f6fb" stroke="#1457a6" stroke-width="3"/>
  <rect x="591" y="360" width="498" height="54" rx="18" fill="#1457a6"/>
  <rect x="591" y="396" width="498" height="18" fill="#1457a6"/>
