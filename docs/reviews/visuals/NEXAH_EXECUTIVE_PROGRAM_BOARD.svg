  <text x="617" y="446" class="item">• Research and scientific validation</text>
  <text x="617" y="478" class="item">• Network and Power Systems applications</text>
  <text x="617" y="510" class="item">• ORION and Kernel stewardship</text>
  <text x="617" y="542" class="item">• Experience public release operations</text>
  <text x="617" y="574" class="item">• NEXAHEDRON release closure</text>
  <text x="617" y="606" class="item">• Library · Atlas · Are.na publication</text>
  <text x="617" y="638" class="item">• Public onboarding and documentation</text>

  <rect x="1124" y="360" width="498" height="300" rx="18" fill="#f7f2fa" stroke="#6d3d91" stroke-width="3"/>
  <rect x="1124" y="360" width="498" height="54" rx="18" fill="#6d3d91"/>
  <rect x="1124" y="396" width="498" height="18" fill="#6d3d91"/>
  <text x="1150" y="395" class="section" fill="#ffffff">STRATEGIC · 3–12 MONTHS</text>
  <text x="1150" y="446" class="item">1. Scientific papers and technical reports</text>
  <text x="1150" y="478" class="item">2. University and research collaboration</text>
  <text x="1150" y="510" class="item">3. Bounded Human studies</text>
  <text x="1150" y="542" class="item">4. Builder and contributor onboarding</text>
  <text x="1150" y="574" class="item">5. Evidence depth in existing applications</text>
  <text x="1150" y="606" class="item">6. Education and public communication</text>
  <text x="1150" y="638" class="item">7. Sustainable stewardship cadence</text>

  <!-- Row 2: Pending / Risks / Opportunities -->
  <rect x="58" y="690" width="498" height="258" rx="18" fill="#fbf7ef" stroke="#b98320" stroke-width="3"/>
  <rect x="58" y="690" width="498" height="54" rx="18" fill="#b98320"/>
  <rect x="58" y="726" width="498" height="18" fill="#b98320"/>
