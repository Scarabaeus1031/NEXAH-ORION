y</text><text x="964" y="503" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="964" y="531" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >No claim outruns</text><text x="964" y="559" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >the documented evidence.</text><rect x="620" y="345" width="296" height="310" rx="16" fill="white" stroke="#092f68" stroke-width="3"/><text x="644" y="387" font-size="24" fill="#092f68" font-weight="700" text-anchor="start" >THRESHOLD</text><text x="644" y="423" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Observe before naming</text><text x="644" y="451" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="644" y="479" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Describe before explaining</text><text x="644" y="507" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="644" y="535" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Test before concluding</text><text x="768" y="805" font-size="30" fill="#092f68" font-weight="700" text-anchor="middle" >OPEN THE FIELD  ↔  TEST THE CLAIM</text><text x="768" y="855" font-size="22" fill="#536174" font-weight="400" text-anchor="middle" >Evidence, provenance and boundaries remain part of the result.</text>
