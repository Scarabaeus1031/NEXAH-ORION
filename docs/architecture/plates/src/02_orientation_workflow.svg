<rect width="1536" height="1024" fill="#ffffff"/>
<rect x="18" y="18" width="1500" height="988" fill="none" stroke="#aab8c8" stroke-width="2"/>
<text x="58" y="72" font-size="18" fill="#1457a6" font-weight="700" text-anchor="start" >ARCHITECTURE PLATE 02</text>
<text x="58" y="126" font-size="42" fill="#152238" font-weight="700" text-anchor="start" >ORIENTATION WORKFLOW</text>
<text x="58" y="166" font-size="22" fill="#1457a6" font-weight="400" text-anchor="start" >Observe, differentiate, connect, build, preserve and share.</text>
<line x1="58" y1="194" x2="1478" y2="194" stroke="#aab8c8" stroke-width="2"/>
<rect x="70" y="350" width="255" height="230" rx="16" fill="white" stroke="#6d3d91" stroke-width="3"/><text x="94" y="392" font-size="22" fill="#6d3d91" font-weight="700" text-anchor="start" >OBSERVE</text><text x="94" y="428" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >See the field</text><text x="94" y="456" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="94" y="484" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Stage 1</text><line x1="325" y1="465" x2="355" y2="465" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="350" width="255" height="230" rx="16" fill="white" stroke="#1457a6" stroke-width="3"/><text x="379" y="392" font-size="22" fill="#1457a6" font-weight="700" text-anchor="start" >DIFFERENTIATE</text><text x="379" y="428" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Make parts visible</text><text x="379" y="456" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="379" y="484" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Stage 2</text><line x1="610" y1="465" x2="640" y2="465" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="350" width="255" height="230" rx="16" fill="white" stroke="#20a6b7" stroke-width="3"/><text x="664" y="392" font-size="22" fill="#20a6b7" font-weight="700" text-anchor="start" >BRIDGE</text><text x="664" y="428" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Connect without merging</text><text x="664" y="456" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="664" y="484" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Stage 3</text><line x1="895" y1="465" x2="925" y2="465" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><rect x="925" y="350" width="255" height="230" rx="16" fill="white" stroke="#b98320" stroke-width="3"/><text x="949" y="392" font-size="22" fill="#b98320" font-weight="700" text-anchor="start" >BUILD</text><text x="949" y="428" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Form a proposed whole</text><text x="949" y="456" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="949" y="484" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Stage 4</text><line x1="1180" y1="465" x2="1210" y2="465" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><rect x="1210" y="350" width="255" height="230" rx="16" fill="white" stroke="#3e7c50" stroke-width="3"/><text x="1234" y="392" font-size="22" fill="#3e7c50" font-weight="700" text-anchor="start" >PRESERVE · SHARE</text><text x="1234" y="428" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Keep provenance</text><text x="1234" y="456" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="1234" y="484" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Stage 5</text><text x="768" y="700" font-size="30" fill="#092f68" font-weight="700" text-anchor="middle" >BREAK DOWN → BRIDGE → BUILD</text><text x="768" y="750" font-size="22" fill="#536174" font-weight="400" text-anchor="middle" >A stable orientation pattern — not a mandatory runtime pipeline.</text><rect x="320" y="810" width="896" height="90" rx="16" fill="white" stroke="#092f68" stroke-width="3"/><text x="344" y="852" font-size="20" fill="#092f68" font-weight="700" text-anchor="start" >AUTHORITY RULE</text><text x="344" y="888" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >A built whole remains a proposal until the responsible deterministic boundary validates it.</text>
<line x1="58" y1="940" x2="1478" y2="940" stroke="#aab8c8" stroke-width="2"/>
<text x="58" y="976" font-size="16" fill="#536174" font-weight="700" text-anchor="start" >NEXAH ORION · ARCHITECTURE DOCUMENTATION</text>
<text x="1478" y="976" font-size="16" fill="#536174" font-weight="700" text-anchor="end" >MARKDOWN REMAINS AUTHORITATIVE</text>
