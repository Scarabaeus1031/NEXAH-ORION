<rect width="1536" height="1024" fill="#ffffff"/>
<rect x="18" y="18" width="1500" height="988" fill="none" stroke="#aab8c8" stroke-width="2"/>
<text x="58" y="72" font-size="18" fill="#1457a6" font-weight="700" text-anchor="start" >ARCHITECTURE PLATE 01</text>
<text x="58" y="126" font-size="42" fill="#152238" font-weight="700" text-anchor="start" >SYSTEM PERSPECTIVE</text>
<text x="58" y="166" font-size="22" fill="#1457a6" font-weight="400" text-anchor="start" >Four responsibilities; no collapsed authority.</text>
<line x1="58" y1="194" x2="1478" y2="194" stroke="#aab8c8" stroke-width="2"/>
<rect x="180" y="250" width="820" height="120" rx="16" fill="white" stroke="#536174" stroke-width="3" stroke-dasharray="12 9"/><text x="204" y="292" font-size="28" fill="#536174" font-weight="700" text-anchor="start" >LUCY · RESERVED</text><text x="204" y="328" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Future Reflection boundary only — no runtime, contract or authority defined.</text><line x1="590" y1="410" x2="590" y2="445" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="417" font-size="18" fill="#092f68" font-weight="700" text-anchor="middle" >human interaction</text><rect x="180" y="450" width="820" height="120" rx="16" fill="white" stroke="#1457a6" stroke-width="3"/><text x="204" y="492" font-size="28" fill="#1457a6" font-weight="700" text-anchor="start" >LYRA · LANGUAGE</text><text x="204" y="528" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Translates human intent and explains structured ORION results faithfully.</text><line x1="590" y1="590" x2="590" y2="625" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="597" font-size="18" fill="#092f68" font-weight="700" text-anchor="middle" >existing inputs / reports</text><rect x="180" y="630" width="820" height="120" rx="16" fill="white" stroke="#20a6b7" stroke-width="3"/><text x="204" y="672" font-size="28" fill="#20a6b7" font-weight="700" text-anchor="start" >ORION · NAVIGATION</text><text x="204" y="708" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Plans registered routes, validates boundaries and reports evidence and blockers.</text><line x1="590" y1="770" x2="590" y2="805" stroke="#092f68" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="777" font-size="18" fill="#092f68" font-weight="700" text-anchor="middle" >bounded access</text><rect x="180" y="810" width="820" height="105" rx="16" fill="white" stroke="#3e7c50" stroke-width="3"/><text x="204" y="852" font-size="28" fill="#3e7c50" font-weight="700" text-anchor="start" >NEXAH · ORIENTATION SPACE</text><text x="204" y="888" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >Defines canonical structure and the deterministic Kernel boundary.</text><rect x="1060" y="310" width="330" height="390" rx="16" fill="white" stroke="#092f68" stroke-width="3"/><text x="1084" y="352" font-size="24" fill="#092f68" font-weight="700" text-anchor="start" >SEPARATION OF AUTHORITY</text><text x="1084" y="388" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >NEXAH defines.</text><text x="1084" y="416" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >ORION navigates.</text><text x="1084" y="444" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >LYRA translates.</text><text x="1084" y="472" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >LUCY remains reserved.</text><text x="1084" y="500" font-size="20" fill="#536174" font-weight="400" text-anchor="start" ></text><text x="1084" y="528" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >No layer inherits the</text><text x="1084" y="556" font-size="20" fill="#536174" font-weight="400" text-anchor="start" >authority of the layer below.</text>
<line x1="58" y1="940" x2="1478" y2="940" stroke="#aab8c8" stroke-width="2"/>
<text x="58" y="976" font-size="16" fill="#536174" font-weight="700" text-anchor="start" >NEXAH ORION · ARCHITECTURE DOCUMENTATION</text>
<text x="1478" y="976" font-size="16" fill="#536174" font-weight="700" text-anchor="end" >MARKDOWN REMAINS AUTHORITATIVE</text>
</svg>