limit_req_zone $binary_remote_addr zone=orion_runtime:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name runtime.nexahedron.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name runtime.nexahedron.com;

    ssl_certificate /etc/letsencrypt/live/runtime.nexahedron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runtime.nexahedron.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ORION_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 2000000;
    client_body_timeout 10s;
    client_header_timeout 5s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /health {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /orientation/v1/requests {
        limit_except POST {
            deny all;
        }
        limit_req zone=orion_runtime burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
